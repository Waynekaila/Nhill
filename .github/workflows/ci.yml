# Nhill — intégration continue : compilation, tests (métier, serveur avec PostgreSQL
# jetable, client), contrôles QML et traductions, captures d'écran de l'interface.
name: ci
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write   # publication des résultats dans ci-results/* (aucun autre écrit)
jobs:
  build-test:
    name: Ubuntu 24.04 — build + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances (dépôts Ubuntu officiels)
        run: scripts/install-deps-linux.sh --with-gui-tests --yes
      - name: Tests métier autonomes (montants, taxes, codes, mots de passe)
        run: scripts/test-common-standalone.sh
      - name: Contrôle statique QML + traductions
        run: python3 scripts/qa/qml-check.py
      - name: La référence de l'API correspond-elle au code du serveur ?
        run: python3 scripts/docs/gen_api_reference.py --check
      - name: Compilation + ctest (common, serveur, installation, client)
        run: scripts/build-linux.sh build
      - name: La référence de la base correspond-elle aux migrations ?
        run: python3 scripts/docs/gen_db_reference.py --server build/server/nhill-server --check
      - name: Session mémorisée — Secret Service réel (gnome-keyring, 2 processus)
        run: |
          sudo apt-get install -y -q --no-install-recommends gnome-keyring dbus >/dev/null
          mkdir -p build/logs
          dbus-run-session -- bash -c 'echo -n "ci-keyring" | gnome-keyring-daemon --unlock --components=secrets >/dev/null &&
            NHILL_KEYCHAIN_REQUIRED=1 QT_QPA_PLATFORM=offscreen build/tests/keychain/test_keychain -v2' 2>&1 |
            tee build/logs/keychain-linux.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Captures d'écran (serveur de démonstration + visite automatique)
        if: always()
        continue-on-error: true
        run: scripts/qa/ui-screenshots.sh build artifacts/screenshots
      - name: Journaux et captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nhill-ci-logs-and-screenshots
          path: |
            build/logs/
            build/Testing/
            artifacts/screenshots/
          if-no-files-found: ignore
      - name: Publication des résultats (branche ci-results/ci)
        if: ${{ !cancelled() }}   # une exécution annulée n'écrase pas les résultats précédents
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          MATRIX_NAME: ''
        run: .github/scripts/publish-results.sh ci-results/ci build/logs build/Testing artifacts/screenshots
