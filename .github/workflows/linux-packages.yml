# Nhill — paquets .deb natifs : Ubuntu 24.04 (Qt 6.4) et Debian 13 (Qt 6.8, conteneur
# officiel debian:trixie). Chaque paquet est compilé, testé, construit puis installé par
# apt dans un système propre (conteneur neuf) pour vérifier ses dépendances.
name: linux-packages
on:
  push:
    tags: ['v*']
    branches: ['release/**']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write   # publication des résultats dans ci-results/* (aucun autre écrit)
jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: debian-13
            image: debian:trixie
    name: .deb ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 120
    steps:
      - name: Outils de base
        run: apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends git ca-certificates sudo
      - uses: actions/checkout@v4
      - name: Dépendances
        run: scripts/install-deps-linux.sh --with-packaging --yes
      - name: Compilation, tests, paquets
        run: scripts/build-deb.sh --force
      - name: Vérification
        run: scripts/verify-build.sh --require linux
      - uses: actions/upload-artifact@v4
        with:
          name: nhill-deb-${{ matrix.name }}
          path: dist/linux/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhill-deb-${{ matrix.name }}-logs
          path: build/logs/
          if-no-files-found: ignore
      - name: Publication des résultats (branche ci-results/deb-${{ matrix.name }})
        if: ${{ !cancelled() }}   # une exécution annulée n'écrase pas les résultats précédents
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          MATRIX_NAME: ${{ matrix.name }}
        run: .github/scripts/publish-results.sh ci-results/deb-${{ matrix.name }} dist/linux build/logs
  install-test:
    name: Installation propre ${{ matrix.name }}
    needs: deb
    # Chaque distribution est testée même si l'autre a échoué (artefact absent = échec de ce job).
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: debian-13
            image: debian:trixie
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Outils de publication
        run: apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          name: nhill-deb-${{ matrix.name }}
          path: debs
      - name: Installation par apt (dépendances résolues depuis les dépôts officiels)
        run: |
          apt-get update -q
          cd debs/* 2>/dev/null || cd debs
          sha256sum -c SHA256SUMS
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q ./nhill-business_*.deb ./nhill-pos_*.deb ./nhill-console_*.deb ./nhill-server_*.deb
      - name: Fichiers installés et démarrage
        shell: bash
        run: |
          set -o pipefail
          mkdir -p install-report
          {
            dpkg -l 'nhill-*'
            for b in nhill-business nhill-pos nhill-console nhill-server; do command -v $b; done
            dpkg -L nhill-pos | grep -E 'applications/nhill-pos.desktop|icons/'
            QT_QPA_PLATFORM=offscreen timeout 8 nhill-pos || [ $? -eq 124 ]
            QT_QPA_PLATFORM=offscreen timeout 8 nhill-business || [ $? -eq 124 ]
            echo "démarrage OK"
          } 2>&1 | tee install-report/install-test.log
      - name: Désinstallation
        shell: bash
        run: |
          set -o pipefail
          { DEBIAN_FRONTEND=noninteractive apt-get remove -y nhill-business nhill-pos nhill-console && ! command -v nhill-pos && echo "désinstallation OK"; } 2>&1 | tee -a install-report/install-test.log
      - name: Publication des résultats (branche ci-results/install-${{ matrix.name }})
        if: ${{ !cancelled() }}   # une exécution annulée n'écrase pas les résultats précédents
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          MATRIX_NAME: ${{ matrix.name }}
        run: src/.github/scripts/publish-results.sh ci-results/install-${{ matrix.name }} install-report
  vps-test:
    # Installation complète sur une machine Ubuntu 24.04 neuve (machine virtuelle GitHub,
    # avec systemd), comme sur un VPS : deploy/vps/provision.sh puis contrôles d'acceptation
    # (exposition réseau, secrets, HTTPS par Caddy, sauvegarde chiffrée, restauration hors du
    # serveur, mise à jour avec retour arrière, refus d'une base plus récente). Certificat de
    # l'autorité locale de Caddy (aucun nom public) ; ce n'est pas un déploiement réel.
    name: VPS — installation et exploitation (Ubuntu 24.04 neuf)
    needs: deb
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nhill-deb-ubuntu-24.04
          path: debs
      - name: ShellCheck des scripts d'exploitation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p vps-report
          shellcheck --version | head -2
          shellcheck -S warning deploy/vps/*.sh deploy/vps/tests/*.sh deploy/backup/*.sh 2>&1 | tee vps-report/shellcheck.txt
      - name: Clé de sauvegarde créée hors du « serveur » (simulation du poste d'administration)
        run: |
          sudo apt-get install -y -q age >/dev/null
          age-keygen -o "$RUNNER_TEMP/backup-key.txt" 2> "$RUNNER_TEMP/backup-pub.txt"
          grep -o 'age1[0-9a-z]*' "$RUNNER_TEMP/backup-pub.txt" > "$RUNNER_TEMP/recipient.txt"
      - name: provision.sh
        shell: bash
        run: |
          set -o pipefail
          mkdir -p vps-report
          deb="$(find debs -name 'nhill-server_*_amd64.deb' | head -1)"; sums="$(dirname "$deb")/SHA256SUMS"
          echo "DEB=$deb" >> "$GITHUB_ENV"; echo "SUMS=$sums" >> "$GITHUB_ENV"
          sudo deploy/vps/provision.sh --deb "$deb" --sha256sums "$sums" --api-domain api.nhill-ci.test --tls internal \
            --admin-email ci-admin@example.com --admin-name "CI" --backup-recipient "$(cat "$RUNNER_TEMP/recipient.txt")" \
            --support-email support@nhill.online --yes 2>&1 | tee vps-report/provision.log
      - name: Contrôles d'acceptation
        shell: bash
        run: |
          set -o pipefail
          sudo deploy/vps/tests/acceptance.sh api.nhill-ci.test "$RUNNER_TEMP/backup-key.txt" "$DEB" "$SUMS" 2>&1 | tee vps-report/acceptance.log
      - name: Journaux
        if: always()
        shell: bash
        run: |
          mkdir -p vps-report
          sudo journalctl -u nhill-server -u caddy -u nhill-backup -u nhill-healthcheck --no-pager -n 400 > vps-report/journal.log 2>&1 || true
          sudo cat /var/lib/nhill/health.json > vps-report/health.json 2>/dev/null || true
          sudo ufw status verbose > vps-report/ufw.txt 2>&1 || true
          sudo ss -ltnup > vps-report/listening.txt 2>&1 || true
          # Jetons à usage unique et chemins locaux : le journal d'installation est publié tel quel
          # (machine éphémère détruite à la fin du job, aucune donnée réelle).
      - name: Publication des résultats (branche ci-results/vps-test)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          MATRIX_NAME: ''
        run: .github/scripts/publish-results.sh ci-results/vps-test vps-report
