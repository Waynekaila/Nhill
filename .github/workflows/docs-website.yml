# Nhill — documentation (PDF depuis Markdown, contrôle de synchronisation) et site vitrine
# (contrôles statiques, tests du backend de formulaires, archive).
name: docs-website
on:
  push:
    branches: [main, 'release/**']
    paths: ['docs/**', 'legal/**', 'marketing/**', 'website/**', 'README*.md', 'scripts/docs/**']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write   # publication des résultats dans ci-results/* (aucun autre écrit)
jobs:
  docs-site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: pandoc + WeasyPrint
        run: scripts/install-deps-linux.sh --with-docs --yes || (sudo apt-get update -q && sudo apt-get install -y -q pandoc weasyprint)
      - name: La référence de l'API correspond-elle au code du serveur ?
        run: python3 scripts/docs/gen_api_reference.py --check
      - name: Les PDF versionnés correspondent-ils aux Markdown ?
        run: scripts/build-docs-pdf.sh --check
      - name: Régénération des PDF
        run: scripts/build-docs-pdf.sh
      - name: Site vitrine
        run: scripts/build-website.sh --force
      - uses: actions/upload-artifact@v4
        with:
          name: nhill-docs-and-website
          path: |
            docs/pdf/
            legal/pdf/
            marketing/pdf/
            README*.pdf
            dist/website/
      - name: Publication des résultats (branche ci-results/docs-website)
        if: ${{ !cancelled() }}   # une exécution annulée n'écrase pas les résultats précédents
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          MATRIX_NAME: ''
        run: .github/scripts/publish-results.sh ci-results/docs-website docs/pdf legal/pdf marketing/pdf README.pdf README.en.pdf dist/website build/logs
  site-backend-postgresql:
    # Mêmes scénarios que les tests SQLite, sur PostgreSQL avec les rôles à privilèges minimaux.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-superuser
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: ci-only-superuser
      NHILL_SITE_PG_TEST: '1'
      SITE_DATABASE_HOST: 127.0.0.1
      SITE_DATABASE_PORT: '5432'
      SITE_DATABASE_NAME: nhill_site
      SITE_DATABASE_USER: nhill_site_app
      SITE_DATABASE_PASSWORD: ci-only-app
      SITE_DATABASE_SSLMODE: disable
      SITE_MAINTENANCE_DATABASE_USER: nhill_site_maint
      SITE_MAINTENANCE_DATABASE_PASSWORD: ci-only-maint
    steps:
      - uses: actions/checkout@v4
      - name: Client PostgreSQL + psycopg 3
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client python3-psycopg
      - name: Rôles, base et schéma
        working-directory: website/backend/schema/postgresql
        run: |
          psql -v ON_ERROR_STOP=1 -v owner_pw=ci-only-owner -v app_pw=ci-only-app \
               -v maint_pw=ci-only-maint -f 000_roles.sql
          PGUSER=nhill_site_owner PGPASSWORD=ci-only-owner psql -v ON_ERROR_STOP=1 -d nhill_site -f 001_init.sql
      - name: Le rôle applicatif ne peut pas relire les demandes
        run: |
          if PGUSER=nhill_site_app PGPASSWORD=ci-only-app psql -d nhill_site -c 'SELECT * FROM submissions' 2>/dev/null; then
            echo "le rôle applicatif lit les demandes : privilèges trop larges"; exit 1
          fi
      - name: Tests du backend sur PostgreSQL
        working-directory: website/backend
        run: python3 -m unittest discover -s tests -v
      - name: Rapport
        if: always()
        shell: bash
        run: mkdir -p pg-report && echo "${{ job.status }}" > pg-report/status.txt
      - name: Publication des résultats (branche ci-results/site-backend-postgresql)
        if: ${{ !cancelled() }}   # une exécution annulée n'écrase pas les résultats précédents
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          MATRIX_NAME: ''
        run: .github/scripts/publish-results.sh ci-results/site-backend-postgresql pg-report
  domain-check:
    # Vérification réelle (lecture seule) du domaine public depuis Internet : DNS, certificat
    # HTTPS, redirections, site déployé, enregistrements MX/SPF/DMARC. Informatif : un domaine
    # pas encore configuré ne bloque pas la CI, mais le rapport publié dit exactement ce qui manque.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Contrôle de nhill.online
        id: live
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p domain-report
          python3 website/tools/check_live.py --domain nhill.online --require-site --require-mail \
            --json domain-report/nhill.online.json --markdown domain-report/nhill.online.md \
            2>&1 | tee domain-report/check-live.log
      - name: Rapport
        if: always()
        shell: bash
        run: echo "${{ steps.live.outcome }}" > domain-report/outcome.txt
      - name: Publication des résultats (branche ci-results/domain-check)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ steps.live.outcome }}
          MATRIX_NAME: ''
        run: .github/scripts/publish-results.sh ci-results/domain-check domain-report
