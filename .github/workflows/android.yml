# Nhill — APK Android de Nhill Business (arm64-v8a), Qt 6.5.3 pour Android, NDK r25c.
# Sans secrets KEYSTORE_*, l'APK est signé avec une clé de débogage (installable, non
# publiable). Pour la publication : secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_ALIAS,
# ANDROID_KEYSTORE_PASS.
name: android
on:
  push:
    tags: ['v*']
    branches: ['release/**']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write   # publication des résultats dans ci-results/* (aucun autre écrit)
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clé de publication (si fournie)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"; fi
      - name: Environnement Android (SDK, NDK, Qt) et construction de l'APK
        shell: bash
        env:
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -o pipefail
          if [ -f "$RUNNER_TEMP/release.keystore" ]; then export KEYSTORE="$RUNNER_TEMP/release.keystore"; fi
          .github/scripts/android-ci.sh 2>&1 | tee android-build-log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nhill-android-apk
          path: dist/android/
      - name: Publication des résultats (branche ci-results/android)
        if: ${{ !cancelled() }}   # une exécution annulée n'écrase pas les résultats précédents
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          MATRIX_NAME: ''
        run: .github/scripts/publish-results.sh ci-results/android dist/android build/logs android-build-log.txt
  keychain-emulator:
    # « Se souvenir de moi » vérifié sur un vrai Android (émulateur x86_64, Keystore) avec
    # fermeture et réouverture de l'application entre les étapes.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test du Keystore sur émulateur
        shell: bash
        run: |
          set -o pipefail
          .github/scripts/android-keychain-emulator.sh 2>&1 | tee android-keychain-log.txt
      - name: Publication des résultats (branche ci-results/android-keychain)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          MATRIX_NAME: ''
        run: .github/scripts/publish-results.sh ci-results/android-keychain android-keychain-log.txt android-keychain-logs
