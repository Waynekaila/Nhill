# Nhill — APK Android de Nhill Business (arm64-v8a), Qt 6.5.3 pour Android, NDK r25c.
# Sans secrets KEYSTORE_*, l'APK est signé avec une clé de débogage (installable, non
# publiable). Pour la publication : secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_ALIAS,
# ANDROID_KEYSTORE_PASS.
name: android
on:
  push:
    tags: ['v*']
    branches: ['release/**']
  workflow_dispatch:
permissions:
  contents: write   # publication des résultats dans ci-results/* (aucun autre écrit)
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK et NDK Android
        uses: android-actions/setup-android@v3
      - name: Composants Android
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;25.2.9519653"
      - name: Qt hôte 6.5.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: linux
          target: desktop
          arch: gcc_64
          modules: 'qtshadertools'
          dir: ${{ runner.temp }}/qt
          cache: true
      - name: Qt 6.5.3 pour Android arm64-v8a
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: 'qtshadertools'
          dir: ${{ runner.temp }}/qt
          cache: true
      - name: Ninja
        run: sudo apt-get install -y -q ninja-build
      - name: Clé de publication (si fournie)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KS_B64 != ''
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Construction de l'APK
        env:
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        shell: bash
        run: |
          set -o pipefail
          export QT_ANDROID="$RUNNER_TEMP/qt/Qt/6.5.3/android_arm64_v8a" QT_HOST="$RUNNER_TEMP/qt/Qt/6.5.3/gcc_64"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          if [ -f "$RUNNER_TEMP/release.keystore" ]; then export KEYSTORE="$RUNNER_TEMP/release.keystore"; fi
          scripts/build-android.sh --force 2>&1 | tee android-build-log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nhill-android-apk
          path: dist/android/
      - name: Publication des résultats (branche ci-results/android)
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          MATRIX_NAME: ''
        run: .github/scripts/publish-results.sh ci-results/android dist/android build/logs android-build-log.txt
