# Nhill — installateurs Windows 10/11 x64 (MSVC 2022 + Qt 6.5.3 + NSIS).
# Produit nhill-business/-pos/-console-<version>-setup.exe (non signés : signer avec
# un certificat de signature de code avant diffusion publique).
name: windows
on:
  push:
    tags: ['v*']
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      server_url:
        description: "Adresse d'API compilée dans les applications (vide = choix au premier lancement)"
        required: false
        default: ""
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write   # publication des résultats dans ci-results/* (aucun autre écrit)
jobs:
  installers:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Qt 6.5.3 MSVC 64 bits
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: 'qtshadertools'
          cache: true
      - name: Environnement MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: NSIS et Ninja
        shell: pwsh
        run: |
          choco install nsis ninja -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: QtKeychain 0.17.0 (source vérifiée, Gestionnaire d'identification Windows)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File packaging\windows\build-qtkeychain.ps1 `
            -QtDir "$env:QT_ROOT_DIR" -Prefix "$env:RUNNER_TEMP\qtkeychain" -WorkDir "$env:RUNNER_TEMP\qtkeychain-work" 2>&1 |
            Tee-Object -FilePath qtkeychain-log.txt
          if (-not (Test-Path "$env:RUNNER_TEMP\qtkeychain\lib\qt6keychain.lib")) { throw "QtKeychain (statique) non construit" }
      - name: Compilation + installateurs
        shell: pwsh
        run: |
          # Journal complet conservé (publié ensuite dans la branche ci-results/windows)
          $a = @('-ExecutionPolicy', 'Bypass', '-File', 'packaging\windows\build-windows.ps1',
                 '-Source', "`"$env:GITHUB_WORKSPACE`"", '-QtDir', "`"$env:QT_ROOT_DIR`"",
                 '-KeychainDir', "`"$env:RUNNER_TEMP\qtkeychain`"",
                 '-BuildDir', "`"$env:GITHUB_WORKSPACE\build-windows`"")
          $url = "${{ github.event.inputs.server_url }}"
          if ($url) { $a += @('-ServerUrl', $url) }
          $p = Start-Process powershell -ArgumentList $a -NoNewWindow -PassThru `
                 -RedirectStandardOutput build-windows-log.txt -RedirectStandardError build-windows-err.txt
          $null = $p.Handle   # garantit la lecture du code de sortie
          $p.WaitForExit()
          Get-Content build-windows-log.txt, build-windows-err.txt
          if ($p.ExitCode -ne 0) { throw "build-windows.ps1 a échoué (code $($p.ExitCode))" }
      - name: Vérification (PE 64 bits, sommes)
        shell: pwsh
        run: |
          $files = Get-ChildItem build-windows\dist\*-setup.exe
          if ($files.Count -ne 3) { throw "3 installateurs attendus, $($files.Count) trouvés" }
          foreach ($f in $files) { $b = [IO.File]::ReadAllBytes($f.FullName)[0..1]; if ([Text.Encoding]::ASCII.GetString($b) -ne 'MZ') { throw "$f invalide" } }
          Get-Content build-windows\dist\SHA256SUMS
      - name: QtKeychain lié à chaque application (statique, Gestionnaire d'identification)
        shell: pwsh
        run: |
          foreach ($app in @('nhill-business', 'nhill-console', 'nhill-pos')) {
            $imports = (& dumpbin.exe /nologo /imports "build-windows\dist\$app\$app.exe") -join "`n"
            foreach ($fn in @('CredReadW', 'CredWriteW', 'CredDeleteW')) {
              if ($imports -notmatch "\b$fn\b") { throw "$app : $fn non importé (QtKeychain absent)" }
            }
            if ($imports -match '(?i)qt6keychain') { throw "$app : dépendance à une DLL QtKeychain" }
            if (Get-ChildItem "build-windows\dist\$app" -Filter '*keychain*.dll') { throw "$app : DLL QtKeychain inattendue" }
            Write-Host "$app : CredReadW, CredWriteW, CredDeleteW importés d'ADVAPI32 ; aucune DLL QtKeychain"
          }
      - name: Session mémorisée — test réel du Gestionnaire d'identification (2 processus)
        shell: pwsh
        run: |
          # Exécutable de test lié à la même bibliothèque QtKeychain statique que les applications ;
          # QCoreApplication seulement : les DLL de Qt suffisent (PATH), sans greffon ni windeployqt.
          $log = "$env:GITHUB_WORKSPACE\keychain-test-log.txt"
          "== test_keychain (Gestionnaire d'identification Windows)" | Out-File -FilePath $log -Encoding utf8
          $exe = "$env:GITHUB_WORKSPACE\build-windows\tests\keychain\test_keychain.exe"
          if (-not (Test-Path $exe)) { "test_keychain.exe absent : $exe" | Out-File -FilePath $log -Append; throw "test_keychain.exe absent" }
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $env:NHILL_KEYCHAIN_REQUIRED = '1'
          $env:QT_QPA_PLATFORM = 'offscreen'
          & $exe -v2 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $log -Append
          $code = $LASTEXITCODE
          "== code de sortie : $code" | Out-File -FilePath $log -Append
          if ($code -ne 0) { throw "test_keychain a échoué (code $code)" }
          if (Select-String -Path $log -Pattern '^SKIP' -Quiet) { throw "test_keychain ignoré : stockage sécurisé indisponible" }
          if (-not (Select-String -Path $log -Pattern 'Totals: \d+ passed, 0 failed, 0 skipped' -Quiet)) { throw "bilan du test introuvable" }
      - name: Installation silencieuse et désinstallation (Nhill POS, Nhill Business)
        shell: pwsh
        run: |
          foreach ($pair in @(@('nhill-pos', 'Nhill POS'), @('nhill-business', 'Nhill Business'))) {
            $setup = Get-ChildItem "build-windows\dist\$($pair[0])-*-setup.exe" | Select-Object -First 1
            Start-Process $setup.FullName -ArgumentList '/S' -Wait
            $dir = "$env:ProgramFiles\$($pair[1])"
            if (-not (Test-Path "$dir\$($pair[0]).exe")) { throw "$($pair[1]) : installation silencieuse échouée" }
            # Le binaire installé est bien celui dont la liaison QtKeychain a été vérifiée.
            $h1 = (Get-FileHash "$dir\$($pair[0]).exe" -Algorithm SHA256).Hash
            $h2 = (Get-FileHash "build-windows\dist\$($pair[0])\$($pair[0]).exe" -Algorithm SHA256).Hash
            if ($h1 -ne $h2) { throw "$($pair[1]) : exécutable installé différent de celui construit" }
            Start-Process "$dir\uninstall.exe" -ArgumentList '/S' -Wait
          }
      - uses: actions/upload-artifact@v4
        with:
          name: nhill-windows-installers
          path: |
            build-windows/dist/*-setup.exe
            build-windows/dist/SHA256SUMS
      - name: Publication des résultats (branche ci-results/windows)
        if: ${{ !cancelled() }}   # une exécution annulée n'écrase pas les résultats précédents
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          MATRIX_NAME: ''
        run: .github/scripts/publish-results.sh ci-results/windows build-windows/dist/*-setup.exe build-windows/dist/SHA256SUMS build-windows-log.txt build-windows-err.txt qtkeychain-log.txt keychain-test-log.txt
